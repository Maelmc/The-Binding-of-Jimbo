[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Pokemon only functionality
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if v.yes_pool_flag and not G.GAME.pool_flags[v.yes_pool_flag] then add = nil end"
position = "after"
payload = '''
if v.set == "Joker" and (not v.mod) and TBOJ.config and TBOJ.config.no_vanilla_joker then add = nil end
'''
match_indent = true