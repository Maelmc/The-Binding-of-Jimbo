[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Custom shatter sound
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''play_sound('glass'..math.random(1, 6), math.random()*0.2 + 0.9,0.5)'''
position = 'at'
match_indent = true
payload = '''
if SMODS.has_enhancement(self, "m_tboj_bone") then
  play_sound('tboj_bone_snap', math.random()*0.2 + 0.9,0.5)
else
  play_sound('glass'..math.random(1, 6), math.random()*0.2 + 0.9,0.5)
end
'''