[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Create the area
[[patches]]
[patches.regex]
target = 'game.lua'
pattern = 'self\.jokers = CardArea'
position = 'before'
payload = '''self.trinkets = CardArea(
  0, CAI.consumeable_H + 0.3,
  CAI.consumeable_W * 0.7,
  CAI.consumeable_H, 
  {card_limit = 1, type = 'joker', highlight_limit = 1}
)
self.trinkets.config.align_buttons = true
'''
match_indent = true
times = 1

# Position it
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = 'G.deck.T.y = G.TILE_H - G.deck.T.h'
position = 'after'
payload = '''

G.trinkets.T.x = G.deck.T.x
G.trinkets.T.y = G.deck.T.y - G.deck.T.h * 1.125
'''
match_indent = true
times = 1

# Emplace the card when bought
[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = 'if c1.ability.consumeable then'
position = 'at'
payload = '''if c1.ability.set == "tboj_trinket" then
  G.trinkets:emplace(c1)
elseif c1.ability.consumeable then
'''
match_indent = true
times = 1

# Make them appear in the shop
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = "local polled_rate = pseudorandom(pseudoseed('cdt'..G.GAME.round_resets.ante))*total_rate"
position = 'before'
payload = '''total_rate = total_rate + G.GAME.tboj_trinket_rate'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = 'for _, v in ipairs(rates) do'
position = 'before'
payload = '''table.insert(rates, { type = "tboj_trinket", val = G.GAME.tboj_trinket_rate  })'''
match_indent = true
times = 1

# Sell button
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''if self.ability.consumeable or self.ability.set == 'Joker' or (self.area and self.area == G.pack_cards) then'''
position = 'at'
payload = '''if self.ability.consumeable or self.ability.set == 'Joker' or (self.area and self.area == G.pack_cards)
or self.ability.set == "tboj_trinket"'''
match_indent = true
times = 1

# Calculate the area
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = "-- TARGET: add your own CardAreas for joker evaluation"
position = "after"
payload = '''
if G.trinkets and G.trinkets.cards then
    t[#t+1] = G.trinkets
end
'''
match_indent = true

# DebugPlus area copy
[[patches]]
[patches.pattern]
target = '=[lovely debugplus.core "debugplus/core.lua"]'
pattern = "elseif _card.ability.consumeable then"
position = "before"
payload = '''
elseif _card.ability.set == "tboj_trinket" then
  _area = G.trinkets
'''
match_indent = true